<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<!-- HAVEN · template de Supabase Auth (Confirm signup). Fuente: haven/supabase/templates/confirmation.html. Se carga en
     Supabase Dashboard → Authentication → Emails (ver docs/AUTH_EMAILS.md). No editar en el Dashboard sin
     actualizar este archivo. -->
<body style="margin:0;padding:0;background:#080b12;font-family:'Manrope',Arial,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#080b12;padding:40px 20px"><tr><td align="center">
<table width="560" cellpadding="0" cellspacing="0" style="background:#131B2C;border:1px solid #25304A;border-radius:16px;overflow:hidden;max-width:560px;width:100%">
  <tr><td style="padding:32px 40px 24px;border-bottom:1px solid #1E2840">
    <table cellpadding="0" cellspacing="0"><tr>
      <td style="width:37px;height:37px;border:1.5px solid #6d7bff;border-radius:12px;text-align:center;vertical-align:middle;line-height:0">
        <img src="https://haven.fenikso.io/email-logo-mark.png" width="31" height="31" alt="" style="display:inline-block;border:0;vertical-align:middle">
      </td>
      <td style="padding-left:12px;vertical-align:middle">
        <div style="font-family:'Space Grotesk',Arial,sans-serif;color:#e8ecf5;font-size:18px;font-weight:700;letter-spacing:.14em">HAVEN</div>
        <div style="color:#7f8aa6;font-size:10px;letter-spacing:.18em;text-transform:uppercase">by Fenikso</div>
      </td>
    </tr></table>
  </td></tr>
  <tr><td style="padding:28px 40px 8px">
    <h1 style="color:#EDF1F8;font-size:20px;font-weight:700;margin:0 0 10px;line-height:1.3">Confirmá tu email</h1>
    <p style="color:#93A1BC;font-size:14px;line-height:1.6;margin:0">Confirmá <strong style="color:#EDF1F8">{{ .Email }}</strong> para terminar de crear tu cuenta de HAVEN.</p>
  </td></tr>
  <tr><td style="padding:28px 40px 12px" align="center">
    <table cellpadding="0" cellspacing="0"><tr><td style="background:#5b6ef5;border-radius:10px">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;color:#fff;font-size:15px;font-weight:700;text-decoration:none;padding:14px 32px">Confirmar email</a>
    </td></tr></table>
  </td></tr>
  <tr><td style="padding:12px 40px 28px">
    <p style="color:#5E6C87;font-size:12px;line-height:1.6;margin:0">Si no creaste una cuenta en HAVEN, ignorá este email.</p>
  </td></tr>
  <tr><td style="padding:20px 40px;border-top:1px solid #1E2840">
    <p style="color:#5E6C87;font-size:12px;margin:0">HAVEN by <strong style="color:#93A1BC">Fenikso</strong> · <a href="https://haven.fenikso.io" style="color:#5b6ef5;text-decoration:none">haven.fenikso.io</a> · <a href="mailto:hola@fenikso.io" style="color:#5b6ef5;text-decoration:none">hola@fenikso.io</a></p>
  </td></tr>
</table></td></tr></table></body></html>
